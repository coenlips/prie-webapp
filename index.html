<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1611" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ricetta">
  <title>Ricetta</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-r.png">
  <link rel="icon" href="icons/icon-192-r.png" type="image/png">
  <link rel="preload" href="fonts/bebas-neue-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/oswald-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="closeBtn" hidden aria-label="Naar je eigen recepten" title="Naar je eigen recepten">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
    </button>
    <button class="icon-btn" id="backBtn" hidden aria-label="Terug">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="title">Ricetta</h1>
    <div class="topbar-actions" id="topActions"></div>
    <nav class="cook-tabs" id="cookTabs" hidden aria-label="Kookstand">
      <button class="icon-btn cook-btn on" id="cookOff" aria-label="Kookstand uit" title="Kookstand uit"></button>
    </nav>
  </header>
  <!-- Kookstand (iPhone en iPad staand): kiezen tussen ingrediënten en bereiding, onder de dubbele streep -->
  <div class="cook-switch" id="cookSwitch" hidden>
    <div class="segmented" role="tablist" aria-label="Kookstand">
      <button role="tab" data-tab="ingr">Ingrediënten</button>
      <button role="tab" data-tab="steps">Bereiding</button>
    </div>
  </div>

  <main id="view"></main>

  <button class="fab" id="addBtn" aria-label="Nieuw recept">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="db.js"></script>
  <script src="config.js"></script>
  <script src="sync.js"></script>
  <script src="app.js"></script>
  <script src="timer.js"></script>
  <script src="importer.js"></script>
  <script src="shopping.js"></script>
</body>
</html>
